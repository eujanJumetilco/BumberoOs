spring.application.name=bumberoos

# Hosts such as Railway pick the port and pass it in PORT. Locally it stays 8080.
server.port=${PORT:8080}

# Optional local file with your Neon credentials (see .env.example). Never commit .env
spring.config.import=optional:file:.env[.properties]

# Neon (PostgreSQL) connection - values come from .env or environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# Set SHOW_SQL=true to print every SQL statement (useful locally, too noisy in production)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Login session cookie. SameSite=Lax + HttpOnly. Set SESSION_COOKIE_SECURE=true when served over HTTPS.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Browser origins allowed to call the API directly (comma-separated). The UI normally goes through its
# same-origin /api proxy, so this only matters for direct calls.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
