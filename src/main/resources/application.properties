spring.application.name=bumberoos

# Optional local file with your Neon credentials (see .env.example). Never commit .env
spring.config.import=optional:file:.env[.properties]

# Neon (PostgreSQL) connection - values come from .env or environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Login session cookie. SameSite=Lax + HttpOnly. Set SESSION_COOKIE_SECURE=true when served over HTTPS.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
